# File: .github/workflows/validate.yml
# Hermes v0.23.1 is installed with its own installer at the pinned commit: a plain pip install from the tag fails on
# Python 3.14 (browser-harness 0.1.13 pins pillow==12.3.0, which has no 3.14 wheel on ubuntu; upstream's uv.lock
# overrides it, pip does not), and Python 3.13 skips every core dependency (markers python_version >= '3.14').
# The installer script is downloaded to a file, then run.
name: validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.14"
      - run: python -m pip install "pytest==9.1.1" "ruamel.yaml==0.18.16" "rich==14.3.4"
      - run: python -m pytest -m "not hermes"
      - run: python scripts/verify-claims.py   # lists the Hermes-tier rows it skips; run --hermes locally for all
  hermes-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: install hermes-agent v0.23.1 (official installer, pinned commit)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hermes-install.sh" https://raw.githubusercontent.com/NousResearch/hermes-agent/v0.23.1/scripts/install.sh
          bash "$RUNNER_TEMP/hermes-install.sh" --commit 3b421578588243f920886e6fe79a6faa87ea026e --non-interactive --skip-browser --skip-computer-use
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hermes --version
      - run: hermes plugins validate . --install-deps --json | tee validate.json
      - run: for d in fixtures/*/; do hermes plugins validate "$d"; done
      - run: hermes plugins doctor . --ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: validate-json
          path: validate.json
