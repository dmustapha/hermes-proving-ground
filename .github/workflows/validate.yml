# File: .github/workflows/validate.yml
# [ASSUMED] installing hermes-agent from the v0.23.1 tag with pip yields a working `hermes` entry point
# (pyproject.toml:592-593 declares `hermes = "hermes_cli.main:main"`, requires-python ">=3.11,<3.15").
# Fallback if it does not: DT-2 in PLAN.md (local validate JSON attached to the PR).
name: validate
on:
  push:
  pull_request:
jobs:
  pure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "pytest==9.1.1" "ruamel.yaml==0.18.16" "rich==14.3.4"
      - run: python -m pytest -m "not hermes"
      - run: python scripts/verify-claims.py
  hermes-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "hermes-agent @ git+https://github.com/NousResearch/hermes-agent@v0.23.1"
      - run: hermes plugins validate . --install-deps --json | tee validate.json
      - run: for d in fixtures/*/; do hermes plugins validate "$d"; done
      - run: hermes plugins doctor . --ci
      - uses: actions/upload-artifact@v4
        with:
          name: validate-json
          path: validate.json
