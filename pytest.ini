# File: pytest.ini
# the repo root holds __init__.py (it is the plugin package), so the default "prepend" import mode would
# derive an invalid package name from the hyphenated directory; importlib mode avoids that.
[pytest]
addopts = --import-mode=importlib -q
testpaths = tests
pythonpath = . tests
markers =
    hermes: needs a local Hermes v0.23.x executable; spawns real sandboxed drill children
